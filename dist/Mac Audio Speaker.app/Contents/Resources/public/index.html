<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e8e8e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mac Speaker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mac Audio Speaker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141416'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23f4f4f0' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23ff4f17'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-state="idle">
  <main class="chassis" data-state="idle">
    <!-- Top Silkscreen Header -->
    <header class="faceplate-header">
      <div class="device-identity">
        <span class="model-tag">MAS-01</span>
        <h1 id="mac-name">Mac Audio Speaker</h1>
      </div>

      <div id="status-badge" class="status-readout" data-state="idle" role="status" aria-live="polite">
        <span class="status-led" aria-hidden="true"></span>
        <span id="status-text">Standby</span>
      </div>
    </header>

    <!-- Recessed Monochrome OLED Display -->
    <section class="oled-bezel" aria-label="Live audio telemetry">
      <div class="oled-screen">
        <div class="oled-top-row">
          <span id="stat-format" class="oled-meta">48 kHz · 2CH</span>
          <div class="oled-metrics">
            <span class="oled-metric">BUF <strong id="stat-buffer">-- ms</strong></span>
            <span class="oled-metric">PING <strong id="stat-ping">-- ms</strong></span>
          </div>
        </div>

        <button id="stage-trigger" class="oled-canvas-wrap" type="button" aria-label="Start listening">
          <canvas id="meter-canvas" width="640" height="240" aria-hidden="true"></canvas>
          <span id="oled-idle-label" class="oled-idle-label">READY TO RECEIVE</span>
        </button>

        <div class="oled-bottom-row">
          <span class="oled-ch-tag">L/R STEREO PCM</span>
          <span id="oled-route-state" class="oled-route-state">MAC MUTED ON CONNECT</span>
        </div>
      </div>
    </section>

    <!-- Inline Warning / Error Strip (only visible when needed) -->
    <div id="error-banner" class="alert-strip" role="alert" hidden>
      <span class="alert-led" aria-hidden="true"></span>
      <span id="error-text"></span>
    </div>

    <!-- Tactile Hardware Deck -->
    <section class="hardware-deck" aria-label="Audio controls">
      <!-- Precision Volume Fader with Ruler Ticks -->
      <div class="module-block">
        <div class="module-head">
          <label for="volume-slider" class="silkscreen-label">Output Level</label>
          <output id="volume-output" for="volume-slider" class="num-readout">100%</output>
        </div>

        <div class="fader-assembly">
          <div class="fader-ruler" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span class="tick-mid"></span>
            <span></span><span></span><span></span><span></span>
            <span class="tick-unity" title="100%"></span>
            <span></span><span></span><span></span><span></span>
            <span class="tick-mid"></span>
          </div>
          <div class="fader-slot">
            <input
              type="range"
              id="volume-slider"
              class="hardware-fader"
              min="0"
              max="150"
              step="1"
              value="100"
              aria-label="Output level"
              aria-valuetext="100 percent"
            >
          </div>
          <div class="fader-scale-labels" aria-hidden="true">
            <span>0</span>
            <span>50</span>
            <span class="scale-unity">100</span>
            <span>150</span>
          </div>
        </div>
      </div>

      <!-- Primary Hardware Keycap + Mute Rocker Row -->
      <div class="keycap-row">
        <button id="play-btn" class="hw-key hw-key-primary" type="button" data-active="false">
          <span class="key-top">
            <span class="key-led" aria-hidden="true"></span>
            <span id="play-icon" class="key-glyph" aria-hidden="true">
              <svg viewBox="0 0 18 18"><path d="M5 3.3l9.8 5.7L5 14.7V3.3z" fill="currentColor"/></svg>
            </span>
          </span>
          <span class="key-bottom">
            <span id="play-label" class="key-title">Listen</span>
            <span id="play-sub" class="key-sub">Connect to Mac</span>
          </span>
        </button>

        <label class="hw-key hw-key-toggle" for="mute-mac-toggle">
          <input type="checkbox" id="mute-mac-toggle" class="sr-checkbox" checked>
          <span class="key-top">
            <span class="mute-led" aria-hidden="true"></span>
            <span class="key-glyph" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M3 7.5h3.2l4.1-3.3v11.6L6.2 12.5H3v-5z" fill="currentColor"/>
                <path class="mute-slash" d="M13.5 7.2l4 5.6M17.5 7.2l-4 5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>
          </span>
          <span class="key-bottom">
            <span class="key-title">Mute Mac</span>
            <span id="mute-sub" class="key-sub">Speakers off</span>
          </span>
        </label>
      </div>

      <!-- Sync Latency Selector Bay -->
      <div class="module-block">
        <div class="module-head">
          <span class="silkscreen-label">Sync Buffer</span>
          <output id="buffer-output" for="buffer-slider" class="num-readout">60 ms</output>
        </div>

        <div class="preset-bay" role="radiogroup" aria-label="Sync buffer presets">
          <button type="button" class="preset-key" data-ms="40" role="radio" aria-checked="false">
            <span class="preset-ms">40</span>
            <span class="preset-name">Tight</span>
          </button>
          <button type="button" class="preset-key" data-ms="60" role="radio" aria-checked="true">
            <span class="preset-ms">60</span>
            <span class="preset-name">Balanced</span>
          </button>
          <button type="button" class="preset-key" data-ms="110" role="radio" aria-checked="false">
            <span class="preset-ms">110</span>
            <span class="preset-name">Stable</span>
          </button>
        </div>

        <input
          type="range"
          id="buffer-slider"
          class="micro-fader"
          min="30"
          max="220"
          step="10"
          value="60"
          aria-label="Fine sync buffer in milliseconds"
          aria-valuetext="60 milliseconds"
        >
      </div>
    </section>

    <!-- Dieter Rams Subtle Acoustic Grille Footer -->
    <footer class="grille-footer" aria-hidden="true">
      <div class="speaker-grille"></div>
      <span class="serial-mark">LAN AUDIO RECEIVER · 16-BIT LINEAR PCM</span>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
