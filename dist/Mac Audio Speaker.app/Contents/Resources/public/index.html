<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mac Speaker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mac Audio Speaker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23339eff'/%3E%3Cstop offset='1' stop-color='%230066eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M16.5 41.5a19 19 0 1 1 31 0'/%3E%3Cpath d='M22 37a12 12 0 1 1 20 0'/%3E%3Cpath d='M27.5 32.5a5.5 5.5 0 1 1 9 0'/%3E%3C/g%3E%3Cpath d='M32 36l9.5 11.5h-19z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb ambient-orb-primary"></div>
    <div class="ambient-orb ambient-orb-secondary"></div>
  </div>

  <main class="app-shell" data-state="idle">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="route-pill">
        <svg class="route-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.64 16.36a9 9 0 1 1 12.72 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M8.46 13.54a5 5 0 1 1 7.08 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 14.5l4.6 5.5H7.4L12 14.5z" fill="currentColor"/>
        </svg>
        <span>Wi-Fi Audio</span>
      </div>

      <div id="status-badge" class="status-pill" data-state="idle" role="status" aria-live="polite">
        <span id="status-text">Ready</span>
      </div>
    </header>

    <!-- Inline Error / Warning Notice -->
    <div id="error-banner" class="notice-banner" role="alert" hidden>
      <svg class="notice-icon" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 2.2L18.2 16.8H1.8L10 2.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M10 7.6v4.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="10" cy="14.3" r="0.95" fill="currentColor"/>
      </svg>
      <span id="error-text"></span>
    </div>

    <!-- Center Acoustic Stage -->
    <section class="stage" aria-label="Audio receiver">
      <button id="stage-trigger" class="stage-visual" type="button" aria-label="Toggle listening">
        <canvas id="meter-canvas" width="520" height="520" aria-hidden="true"></canvas>
        <div class="medallion">
          <svg class="airplay-glyph" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M7.8 24.4a13.5 13.5 0 1 1 20.4 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M11.6 21.1a8.5 8.5 0 1 1 12.8 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M15.4 17.8a3.8 3.8 0 1 1 5.2 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M18 20.4l6.8 8.1H11.2L18 20.4z" fill="currentColor"/>
          </svg>
        </div>
      </button>

      <div class="source-meta">
        <h1 id="mac-name">Mac Audio Speaker</h1>
        <p id="stat-format" class="source-subtitle">48 kHz Stereo</p>
      </div>
    </section>

    <!-- Primary Play / Stop Action -->
    <div class="primary-action">
      <button id="play-btn" class="play-btn" type="button" data-active="false">
        <span id="play-icon" class="play-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M5.5 3.6c0-.85.94-1.36 1.66-.9l9.6 6.1c.66.42.66 1.38 0 1.8l-9.6 6.1c-.72.46-1.66-.05-1.66-.9V3.6z" fill="currentColor"/></svg>
        </span>
        <span id="play-label">Start Listening</span>
      </button>
    </div>

    <!-- iOS Control Center Volume Scrubber -->
    <section class="volume-section" aria-label="iPhone volume">
      <div class="volume-header">
        <label for="volume-slider">Volume</label>
        <output id="volume-output" for="volume-slider">100%</output>
      </div>
      <div class="scrubber-row">
        <svg class="vol-icon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3.5 7.5h3.1l4-3.3c.5-.4 1.2-.05 1.2.6v10.4c0 .65-.7 1-1.2.6l-4-3.3H3.5c-.6 0-1-.45-1-1v-3c0-.55.4-1 1-1z" fill="currentColor"/>
        </svg>
        <div class="scrubber-wrap" id="volume-scrubber-wrap">
          <input
            type="range"
            id="volume-slider"
            class="ios-scrubber"
            min="0"
            max="150"
            step="1"
            value="100"
            aria-label="iPhone volume"
            aria-valuetext="100 percent"
          >
        </div>
        <svg class="vol-icon" viewBox="0 0 22 20" aria-hidden="true">
          <path d="M2.5 7.5h3.1l4-3.3c.5-.4 1.2-.05 1.2.6v10.4c0 .65-.7 1-1.2.6l-4-3.3H2.5c-.6 0-1-.45-1-1v-3c0-.55.4-1 1-1z" fill="currentColor"/>
          <path d="M13.8 7.1a4 4 0 0 1 0 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16.5 4.7a7.3 7.3 0 0 1 0 10.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
    </section>

    <!-- Native iOS Grouped Settings Card -->
    <section class="settings-group" aria-label="Playback settings">
      <label class="setting-row" for="mute-mac-toggle">
        <span class="setting-copy">
          <span class="setting-title">Mute Mac Speakers</span>
          <span class="setting-desc">Play audio only on this iPhone</span>
        </span>
        <span class="ios-switch">
          <input type="checkbox" id="mute-mac-toggle" checked>
          <span class="ios-switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <div class="setting-divider" aria-hidden="true"></div>

      <div class="setting-row setting-row-stack">
        <div class="setting-top-line">
          <span class="setting-title">Sync Latency</span>
          <output id="buffer-output" for="buffer-slider" class="setting-value">60 ms</output>
        </div>

        <div class="segmented-control" role="radiogroup" aria-label="Sync buffer presets">
          <div class="segmented-thumb" id="segmented-thumb" aria-hidden="true"></div>
          <button type="button" class="segment-btn" data-ms="40" role="radio" aria-checked="false">Tight</button>
          <button type="button" class="segment-btn" data-ms="60" role="radio" aria-checked="true">Balanced</button>
          <button type="button" class="segment-btn" data-ms="110" role="radio" aria-checked="false">Stable</button>
        </div>

        <input
          type="range"
          id="buffer-slider"
          class="fine-slider"
          min="30"
          max="220"
          step="10"
          value="60"
          aria-label="Fine sync buffer in milliseconds"
          aria-valuetext="60 milliseconds"
        >
      </div>
    </section>

    <!-- Quiet Bottom Telemetry -->
    <footer class="telemetry-bar" aria-label="Connection metrics">
      <div class="metric">
        <span class="metric-label">Buffer</span>
        <strong id="stat-buffer">-- ms</strong>
      </div>
      <span class="metric-sep" aria-hidden="true"></span>
      <div class="metric">
        <span class="metric-label">Wi-Fi Ping</span>
        <strong id="stat-ping">-- ms</strong>
      </div>
    </footer>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
